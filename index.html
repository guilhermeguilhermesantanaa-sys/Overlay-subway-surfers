<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay NO COIN</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  .overlay {
    position: absolute;
    top: 18px;
    left: 18px;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.35;
    text-shadow: 1px 2px 4px rgba(0,0,0,.85);
    white-space: nowrap;
  }
  .overlay div:nth-child(2),
  .overlay div:nth-child(3) {
    font-size: 16px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="overlay">
    <div>record:4.05</div>
    <div>site:morrowplay.com</div>
    <div>Segui=arrogante</div>
  </div>
</body>
</html>
